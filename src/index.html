<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#191813">
<meta name="description" content="Agent X-Ray — 完全离线的 AI Coding Agent 内部原理解析与交互透视沙盒（12 个渐进式双语场景 + 5 标签 X-Ray 协议透视）">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<title>Agent X-Ray · AI Agent 透视镜</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

  <symbol id="i-branch" viewBox="0 0 24 24"><circle cx="6" cy="6" r="2.2"/><circle cx="18" cy="6" r="2.2"/><circle cx="6" cy="18" r="2.2"/><circle cx="18" cy="18" r="2.2"/><path d="M8.2 6h3.3a3 3 0 0 1 3 3v6a3 3 0 0 0 3 3h.3"/><path d="M8.2 18h3.3a3 3 0 0 0 3-3v-6a3 3 0 0 1 3-3h.3"/></symbol>
  <symbol id="i-mcp" viewBox="0 0 24 24"><circle cx="12" cy="12" r="2.4"/><circle cx="5" cy="6" r="1.8"/><circle cx="19" cy="6" r="1.8"/><circle cx="5" cy="18" r="1.8"/><circle cx="19" cy="18" r="1.8"/><path d="M6.4 7.3 10 10.3M17.6 7.3 14 10.3M6.4 16.7 10 13.7M17.6 16.7 14 13.7"/></symbol>
  <symbol id="i-skill" viewBox="0 0 24 24"><path d="M5 4.5h9l5 5V20H5Z"/><path d="M14 4.5V10h5"/><path d="M8.5 13h7M8.5 16.5h4.5"/></symbol>
  <symbol id="i-subagent" viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="13" width="8" height="8" rx="2"/><path d="M7 11v4a2 2 0 0 0 2 2h4"/></symbol>
  <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3 4.5 6v5.5c0 4.4 3 7.4 7.5 9.5 4.5-2.1 7.5-5.1 7.5-9.5V6Z"/><path d="m9 12 2 2 4-4"/></symbol>
  <symbol id="i-memory" viewBox="0 0 24 24"><path d="M4 7.5h16v9H4z"/><path d="M8 7.5v9M16 7.5v9M4 10.5h4M4 13.5h4M16 10.5h4M16 13.5h4"/><path d="M7 4.5h10"/></symbol>
  <symbol id="i-flag" viewBox="0 0 24 24"><path d="M6 21V4"/><path d="M6 4h11l-2 4 2 4H6"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13l10-6.5Z"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24"><path d="M9 5v14M15 5v14"/></symbol>
  <symbol id="i-reset" viewBox="0 0 24 24"><path d="M4 10a8 8 0 1 1 2 6"/><path d="M4 5v5h5"/></symbol>
  <symbol id="i-bulb" viewBox="0 0 24 24"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-4 10.5c.6.6 1 1.4 1 2.3V16h6v-.2c0-.9.4-1.7 1-2.3A6 6 0 0 0 12 3Z"/></symbol>
  <symbol id="i-send" viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></symbol>
  <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7"/></symbol>
  <symbol id="i-terminal" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="m7 9 3 3-3 3M13 15h4"/></symbol>
  <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.5 3.5 5.5 3.5 9s-1 6.5-3.5 9c-2.5-2.5-3.5-5.5-3.5-9s1-6.5 3.5-9Z"/></symbol>
  <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></symbol>
  <symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5 18 18M18 6l-2.5 2.5M8.5 15.5 6 18"/></symbol>
  <symbol id="i-file" viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6Z"/><path d="M14 3v4h4"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
  <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2.8v2.4M12 18.8v2.4M2.8 12h2.4M18.8 12h2.4M5.5 5.5l1.7 1.7M16.8 16.8l1.7 1.7M18.5 5.5l-1.7 1.7M7.2 16.8l-1.7 1.7"/></symbol>
  <symbol id="i-fork" viewBox="0 0 24 24"><circle cx="6" cy="5" r="2"/><circle cx="18" cy="5" r="2"/><circle cx="6" cy="19" r="2"/><path d="M6 7v10M18 7v3a4 4 0 0 1-4 4H8"/></symbol>

  <symbol id="i-zap" viewBox="0 0 24 24"><path d="M13 2 4 14h6l-1 8 9-12h-6l1-8Z"/></symbol>
  <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.6"/><path d="M4.5 21a7.5 7.5 0 0 1 15 0"/></symbol>
  <symbol id="i-robot" viewBox="0 0 24 24"><rect x="4" y="7" width="16" height="12" rx="3"/><circle cx="9" cy="12.5" r="1.2"/><circle cx="15" cy="12.5" r="1.2"/><path d="M12 3v4M9 16h6"/></symbol>
  <symbol id="i-compass" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><polygon points="15.5 8.5 13.4 13.4 8.5 15.5 10.6 10.6 15.5 8.5"/></symbol>
  <symbol id="i-warn" viewBox="0 0 24 24"><path d="M12 3.5 2.8 19.5h18.4Z"/><path d="M12 10v4.2M12 17h.01"/></symbol>
  <symbol id="i-expand" viewBox="0 0 24 24"><path d="M15 4h5v5M9 20H4v-5M20 4l-6 6M4 20l6-6"/></symbol>
  <symbol id="i-compress" viewBox="0 0 24 24"><path d="M4 14h6v6M20 10h-6V4M10 14l-6 6M14 10l6-6"/></symbol>
  <symbol id="i-github" viewBox="0 0 24 24"><path d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0 1 12 6.844a9.59 9.59 0 0 1 2.504.337c1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.02 10.02 0 0 0 22 12.017C22 6.484 17.522 2 12 2Z"/></symbol>

<div id="app">
  <header class="topbar">
    <div class="topbar-left">
      <div class="brand">
        <div class="brand-mark">
          <svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="13" fill="none" stroke="currentColor" stroke-width="1.6" opacity=".5"/><circle cx="16" cy="16" r="4" fill="currentColor"/><circle cx="16" cy="3" r="1.8" fill="currentColor"/><circle cx="29" cy="16" r="1.8" fill="currentColor"/><circle cx="16" cy="29" r="1.8" fill="currentColor"/><circle cx="3" cy="16" r="1.8" fill="currentColor"/><path d="M16 5v7M27 16h-7M16 27v-7M5 16h7" stroke="currentColor" stroke-width="1" opacity=".55"/></svg>
        </div>
        <div class="brand-text">
          <div class="brand-name">Agent X-Ray</div>
          <div class="brand-sub" data-i18n="appSub">Interactive Internals</div>
        </div>
      </div>
      <a class="iconbtn github-btn" id="githubBtn" href="https://github.com/raymondtree/agent-xray" target="_blank" rel="noopener noreferrer">
        <svg class="ic ic-fill"><use href="#i-github"/></svg>
      </a>
    </div>

    <div class="topbar-right">
      <div class="zoom-ctl" id="zoomCtl">
        <select id="zoomSelect" aria-label="Zoom">
          <option value="0.5">50%</option>
          <option value="0.75">75%</option>
          <option value="0.9">90%</option>
          <option value="1" selected>100%</option>
          <option value="1.1">110%</option>
          <option value="1.25">125%</option>
          <option value="1.5">150%</option>
          <option value="1.75">175%</option>
          <option value="2">200%</option>
        </select>
      </div>
      <button class="btn ghost tour-btn" id="tourBtn">
        <svg class="ic"><use href="#i-compass"/></svg><span data-i18n="tour">Guide Tour</span>
      </button>
      <div class="seg" id="langSeg" role="group" aria-label="language">
        <button data-lang="bi" class="on">中英</button>
        <button data-lang="zh">中文</button>
        <button data-lang="en">EN</button>
        <button type="button" class="lang-cycle" id="langCycleBtn" aria-label="Switch language">中英</button>
      </div>
      <button class="iconbtn" id="themeBtn">
        <svg class="ic"><use href="#i-spark"/></svg>
      </button>
      <button class="iconbtn" id="resetAllBtn">
        <svg class="ic"><use href="#i-reset"/></svg>
      </button>
    </div>
  </header>

  <div class="shell" id="shell">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-inner">
        <div class="side-head">
          <div class="side-title">
            <span class="side-title-lbl" data-i18n="listTitle">Experiences</span>
          </div>
          <div class="side-prog-row">
            <div class="side-progress"><i id="doneBar"></i></div>
          </div>
          <span class="side-count" id="doneCount"><span class="sc-done">0</span><span class="sc-sep"> / </span><span class="sc-tot">12</span></span>
          <button class="side-toggle on" id="sideToggleBtn" type="button">
            <svg class="ic" viewBox="0 0 20 20" aria-hidden="true">
              <rect x="2.25" y="2.25" width="15.5" height="15.5" rx="3"/>
              <line x1="8" y1="2.25" x2="8" y2="17.75"/>
              <path class="panel-arrow" d="M5.9 7.75 L4.2 10 L5.9 12.25"/>
            </svg>
          </button>
        </div>
        <nav class="scn-list" id="scnList"></nav>
        <div class="side-foot">
          <div class="side-tip" id="sideTip">
            <span class="side-tip-ic"><svg class="ic"><use href="#i-bulb"/></svg></span>
            <div class="side-tip-text"><div class="side-tip-inner" data-i18n-bi="sideTip"></div></div>
          </div>
        </div>
      </div>
    </aside>

    <main class="console">
      <div class="scn-head">
        <div class="scn-head-top">
          <div class="scn-icon" id="scnIcon"></div>
          <div class="scn-titles">
            <h1 id="scnTitle">—</h1>
          </div>
          <div class="scn-actions">
            <button class="btn ghost" id="hintBtn">
              <svg class="ic"><use href="#i-bulb"/></svg><span data-i18n="howTo">Guide</span><b class="badge" id="hintBadge">3</b>
            </button>
            <button class="btn ghost" id="playBtn">
              <svg class="ic"><use href="#i-play"/></svg><span data-i18n="autoplay">Auto play</span>
            </button>
            <button class="btn icon" id="resetBtn">
              <svg class="ic"><use href="#i-reset"/></svg>
            </button>
            <button class="btn icon xray-expand-btn" id="xrayExpandBtn" type="button" hidden>
              <svg class="ic" viewBox="0 0 20 20" aria-hidden="true">
                <rect x="2.25" y="2.25" width="15.5" height="15.5" rx="3"/>
                <line x1="12" y1="2.25" x2="12" y2="17.75"/>
                <path class="panel-arrow" d="M14.1 7.75 L15.8 10 L14.1 12.25"/>
              </svg>
            </button>
          </div>
        </div>
        <p class="scn-sub" id="scnSub">—</p>
      </div>

      <div class="stepbar" id="stepbar">
        <span class="step-cue" data-i18n="stepJump">Step Jump</span>
        <div class="dots" id="stepDots"></div>
        <div class="step-label" id="stepLabel"></div>
      </div>

      <div class="chat" id="chat"></div>

      <div class="composer">
        <div class="ctx-strip">
          <span class="chip" id="ctxChip"><svg class="ic"><use href="#i-context"/></svg><b>0</b> tokens</span>
          <span class="chip" id="streamChip">stream on</span>
          <span class="chip" id="toolsChip">tools 6</span>
          <button class="chip btnlike" id="sandboxBtn"><svg class="ic"><use href="#i-gear"/></svg><span data-i18n="params">Request params</span></button>
          <span class="offline"><i></i><span data-i18n="offline">Offline sim</span></span>
        </div>
        <div class="input-wrap">
          <textarea id="composerInput" rows="1" placeholder=""></textarea>
          <button class="sendbtn" id="sendBtn">
            <svg class="ic"><use href="#i-send"/></svg>
          </button>
        </div>
      </div>
    </main>

    <section class="xray" id="xrayPanel">
      <div class="xray-inner">
        <div class="xray-head">
          <div class="tabs" id="xrayTabs"></div>
          <button class="xray-toggle on" id="xrayToggleBtn" type="button">
            <svg class="ic" viewBox="0 0 20 20" aria-hidden="true">
              <rect x="2.25" y="2.25" width="15.5" height="15.5" rx="3"/>
              <line x1="12" y1="2.25" x2="12" y2="17.75"/>
              <path class="panel-arrow" d="M14.1 7.75 L15.8 10 L14.1 12.25"/>
            </svg>
          </button>
        </div>
        <div class="xray-body" id="xrayBody"></div>
      </div>
    </section>
  </div>
</div>

<div id="toast" class="toast"></div>
<div id="modalRoot"></div>
<div id="tourRoot"></div>
<div id="tooltip" class="tooltip"></div>
<div id="stepTip" class="step-tip"></div>

<script src="data.js"></script>
<script src="xray.js"></script>
<script src="app.js"></script>
</body>
</html>
